<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel-CPS | Lane Builder</title>
    <style>
        /* THESIS CONSTRAINT: TV-AS-A-TRACK EXECUTION */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Absolute black for zero-luminance */
            overflow: hidden; /* Prevent scrolling on the TV */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .track-lane {
            width: 80vw;
            height: 60vh;
            border: 100px solid #FFFFFF; /* High-luminance white for ADC sensors */
            border-radius: 300px; /* Creates a smooth oval loop */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="track-lane"></div>
</body>
</html>
