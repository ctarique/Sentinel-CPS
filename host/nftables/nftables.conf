flush ruleset

table inet filter {
    # ==========================================
    # THESIS CONSTRAINT: TIERED MAC WHITELISTING
    # ==========================================
    set admin_macs {
        type ether_addr
        # MacBook Pro (en0) and Windows Bastion Host
        elements = { 60:7d:09:b8:3f:77, 04:d4:c4:f3:33:ce }
    }

    set dashboard_macs {
        type ether_addr
        # To be updated with the Smart TV MAC address tomorrow
        elements = { 00:00:00:00:00:00 } 
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Allow established/related connections and local loopback
        ct state invalid drop
        iif "lo" accept
        ct state { established, related } accept

        # ==========================================
        # THESIS CONSTRAINT: mDNS RESILIENCE
        # ==========================================
        # Allows iot-pi.local to resolve without a static DHCP lease
        udp dport 5353 ip daddr 224.0.0.251 accept
        udp dport 5353 ip6 daddr ff02::fb accept

        # Allow basic ICMP (ping) for lab troubleshooting
        ip protocol icmp icmp type echo-request limit rate 1/second accept

        # ==========================================
        # THESIS CONSTRAINT: LEAST-PRIVILEGE ADMINISTRATION
        # ==========================================
        # SSH (Port 22): STRICTLY ADMINS ONLY
        tcp dport 22 ether saddr @admin_macs accept

        # C2 Web App (Port 8080): ADMINS AND SMART TV
        tcp dport 8080 ether saddr @admin_macs accept
        tcp dport 8080 ether saddr @dashboard_macs accept
    }

    # ==========================================
    # THESIS CONSTRAINT: LAYER 2 HLAC (ANTI-BRIDGING)
    # ==========================================
    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
