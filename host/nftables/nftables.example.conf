flush ruleset

table inet filter {
    # ==========================================
    # SENTINEL-CPS: TIERED MAC WHITELISTING
    # ==========================================
    # Replace placeholder MAC addresses during local deployment.
    # Do not commit live endpoint MAC addresses.

    set admin_macs {
        type ether_addr
        elements = { <ADMIN_ENDPOINT_MAC_1>, <ADMIN_ENDPOINT_MAC_2> }
    }

    set dashboard_macs {
        type ether_addr
        elements = { <DISPLAY_ENDPOINT_MAC> }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        iif "lo" accept
        ct state { established, related } accept

        # mDNS for local iot-pi.local resolution
        udp dport 5353 ip daddr 224.0.0.251 accept
        udp dport 5353 ip6 daddr ff02::fb accept

        # Rate-limited ICMP for lab troubleshooting
        ip protocol icmp icmp type echo-request limit rate 1/second accept

        # SSH management: approved administrative endpoints only
        tcp dport 22 ether saddr @admin_macs accept

        # Sentinel-CPS C2 dashboard: approved admin/display endpoints only
        tcp dport 8080 ether saddr @admin_macs accept
        tcp dport 8080 ether saddr @dashboard_macs accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
